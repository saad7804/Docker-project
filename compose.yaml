services:
  app:
    build: .
    container_name: opsmate-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      - database
    networks:
      - opsmate-network

  database:
    image: mysql:8.0
    container_name: opsmate-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - opsmate-db-data:/var/lib/mysql
    networks:
      - opsmate-network

networks:
  opsmate-network:

volumes:
  opsmate-db-data:
